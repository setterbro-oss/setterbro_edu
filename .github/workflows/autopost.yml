name: Auto Post Generator

on:
  schedule:
     # 매일 한국시간 오후 7시 (UTC 10:00) 자동 실행
    - cron: '0 10 * * *'
  # GitHub 화면에서 수동 버튼(Run workflow)으로 즉시 실행
  workflow_dispatch:

# 동시에 두 번 실행되어 충돌하는 것을 방지
concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Git push 권한 부여

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate New Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_post.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 새 글 + 중복 방지 기록 파일을 함께 저장
          git add -A src/content/posts scripts
          if git diff --cached --quiet; then
            echo "변경 사항 없음: 커밋하지 않습니다."
          else
            # [skip ci] 를 넣지 않아야 사이트가 자동으로 새로 빌드됩니다
            git commit -m "auto: publish new blog post"
            git push
          fi
