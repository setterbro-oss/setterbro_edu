name: Daily Auto Post

on:
  schedule:
    # 매일 한국 시간 오전 09:30 (UTC 00:30) / 오후 19:00 (UTC 10:00)
    - cron: '30 0,10 * * *'
  workflow_dispatch: # 깃허브 화면에서 [글 즉시 생성] 수동 실행 버튼

permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Post Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_post.py

      - name: Commit and Push New Post
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto post: $(date '+%Y-%m-%d %H:%M')" && git push)
