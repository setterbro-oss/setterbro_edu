name: Auto Post Generator

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00) 자동 실행
    - cron: '0 0 * * *'
  # GitHub 화면에서 수동 버튼(Run workflow)으로 즉시 실행
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Git push 권한 부여

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate New Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generate_post.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/
          git diff-index --quiet HEAD || git commit -m "auto: publish new blog post [skip ci]"
          git push
